name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Gate: läuft auch auf PRs und blockt den Push-Job bei Fehlern.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # E2E im echten Browser. Lint, Unit-Tests und Build haben an einem Tag
      # sechs Fehler durchgelassen, die alle erst hier aufgefallen sind.
      - name: Browser für E2E installieren
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Bericht bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: playwright-report/
          retention-days: 7

  build:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Nie zwei Bau-Läufe gleichzeitig: sonst kann ein älterer Lauf sein
    # :latest NACH einem neueren pushen, und Portainer zöge das alte Image in
    # die Küche. Wartende Läufe reihen sich ein; GitHub behält davon nur den
    # neuesten, und der ist der richtige.
    concurrency:
      group: bauen-und-ausrollen
      cancel-in-progress: false
    # Zum Nachziehen des deploy-Branches am Ende des Jobs
    permissions:
      contents: write
    env:
      IMAGE_NAME: splord/labelkitchen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Volle Historie: sonst kann der Push auf deploy den Fast-Forward
          # nicht belegen und wird abgelehnt (flacher Klon hat keine Vorgänger).
          fetch-depth: 0

      - name: Set Docker Tag (commit hash + date)
        id: version
        run: |
          DATE=$(date +"%Y%m%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Erst lokal bauen und starten, dann pushen: Portainer zieht jedes
      # gepushte :latest binnen einer Minute in die Küche. Ein Image, das nicht
      # startet, darf dort nie ankommen.
      - name: Image bauen (lokal)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}

      - name: Rauchtest – startet das Image mit und ohne Bugsink?
        env:
          IMG: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          # Syntaktisch gültig, Host existiert nicht: der Tunnel muss dann 502
          # liefern, nginx aber trotzdem laufen.
          SCHEIN_DSN: https://00000000000000000000000000000000@bugsink.invalid/9
        run: |
          set -eu
          docker run -d --name ohne   -p 8081:80 "$IMG"
          docker run -d --name mit    -p 8082:80 -e SENTRY_DSN="$SCHEIN_DSN" "$IMG"
          docker run -d --name kaputt -p 8083:80 -e SENTRY_DSN=nicht-gueltig "$IMG"
          for p in 8081 8082 8083; do
            for i in $(seq 1 20); do curl -fsS "localhost:$p/" >/dev/null 2>&1 && break; sleep 0.5; done
            curl -fsS "localhost:$p/" >/dev/null
          done
          status() { curl -s -o /dev/null -w '%{http_code}' -X POST "localhost:$1/api/9/envelope/" -d x; }

          # Ohne DSN: kein Tracking, kein Tunnel
          curl -fsS localhost:8081/api/client-config | grep -q '"enabled":false'
          test "$(status 8081)" = 404
          # Mit DSN: freigegeben, Tunnel vorhanden (Ziel unerreichbar -> 502)
          curl -fsS localhost:8082/api/client-config | grep -q '"enabled":true'
          curl -fsS localhost:8082/api/client-config | grep -q '"projekt":"9"'
          test "$(status 8082)" = 502
          # Kaputter DSN verhindert den Start nicht, schaltet nur ab
          curl -fsS localhost:8083/api/client-config | grep -q '"enabled":false'
          # Der Schlüssel taucht weder beim Browser noch in den Logs auf.
          # Bewusst if/exit statt "! befehl": ein mit ! verneinter Befehl
          # bricht unter set -e nicht ab – die Prüfung wäre zahnlos.
          if curl -fsS localhost:8082/api/client-config | grep -q 00000000000000000000000000000000; then
            echo "Schlüssel in /api/client-config sichtbar"; exit 1
          fi
          docker logs mit 2>&1 | grep -q 'Fehlertracking aktiv'
          if docker logs mit 2>&1 | grep -q 00000000000000000000000000000000; then
            echo "Schlüssel in den Container-Logs"; exit 1
          fi
          # Der Tunnel leitet richtig weiter: die tatsächlich geladene
          # Konfiguration muss die tragenden Direktiven enthalten. Ob TLS und
          # Bugsink wirklich mitspielen, zeigt erst der Test gegen das echte
          # Bugsink nach dem Ausrollen – bugsink.invalid ist nie erreichbar.
          KONF=$(docker exec mit nginx -T 2>/dev/null)
          for d in 'sentry_key=00000000000000000000000000000000' 'set $args ""' \
                   'proxy_ssl_verify on' 'proxy_ssl_verify_depth 3' \
                   'limit_req zone=bugsink_gesamt' 'proxy_set_header Cookie ""' \
                   'location = /api/9/envelope/'; do
            printf '%s' "$KONF" | grep -qF "$d" || { echo "fehlt in der Konfiguration: $d"; exit 1; }
          done
          # Die Startseite darf nicht ungefragt aus dem Zwischenspeicher kommen
          curl -sI localhost:8081/ | grep -qi '^cache-control: no-cache' || { echo "Startseite ohne no-cache"; exit 1; }
          # Der Etikettenspeicher läuft unverändert
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8081/daten/etiketten.json)" = 204
          echo "Rauchtest bestanden"

      - name: Rauchtest – Logs bei Fehlschlag
        if: failure()
        run: for c in ohne mit kaputt; do echo "== $c"; docker logs "$c" 2>&1 | tail -20; done

      - name: Image pushen
        run: docker push --all-tags ${{ env.IMAGE_NAME }}

      # Portainer beobachtet den deploy-Branch, nicht main. Er wird erst hier
      # nachgezogen – also nachdem das Image wirklich in der Registry liegt.
      # Vorher pollte Portainer main im Minutentakt und erwischte den Commit
      # gelegentlich, bevor das Image fertig war: dann wurde der alte Stand
      # ausgerollt und der Commit als erledigt vermerkt, ohne Selbstheilung.
      - name: Deploy-Branch nachziehen
        run: git push origin HEAD:refs/heads/deploy
