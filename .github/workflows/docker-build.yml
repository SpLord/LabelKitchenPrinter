name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Gate: läuft auch auf PRs und blockt den Push-Job bei Fehlern.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # E2E im echten Browser. Lint, Unit-Tests und Build haben an einem Tag
      # sechs Fehler durchgelassen, die alle erst hier aufgefallen sind.
      - name: Browser für E2E installieren
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Bericht bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: playwright-report/
          retention-days: 7

  build:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Zum Nachziehen des deploy-Branches am Ende des Jobs
    permissions:
      contents: write
    env:
      IMAGE_NAME: splord/labelkitchen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Volle Historie: sonst kann der Push auf deploy den Fast-Forward
          # nicht belegen und wird abgelehnt (flacher Klon hat keine Vorgänger).
          fetch-depth: 0

      - name: Set Docker Tag (commit hash + date)
        id: version
        run: |
          DATE=$(date +"%Y%m%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}

      # Portainer beobachtet den deploy-Branch, nicht main. Er wird erst hier
      # nachgezogen – also nachdem das Image wirklich in der Registry liegt.
      # Vorher pollte Portainer main im Minutentakt und erwischte den Commit
      # gelegentlich, bevor das Image fertig war: dann wurde der alte Stand
      # ausgerollt und der Commit als erledigt vermerkt, ohne Selbstheilung.
      - name: Deploy-Branch nachziehen
        run: git push origin HEAD:refs/heads/deploy
