name: Build & Push Docker Image

# Jeder Commit wird genau einmal gebaut: push auf alle Branches, kein
# zusätzlicher pull_request-Lauf mit identischem Ergebnis (Vorgabe 2026-10-07).
on:
  push:
    branches:
      - '**'
    tags:
      - '**'

# Neuer Push auf denselben Ref bricht den alten Lauf ab – bei Tags nie.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Gate: läuft auf jedem Branch und blockt den Push-Job bei Fehlern.
  # Läuft auf der eigenen Build-Farm Farmhaus statt auf GitHub-Runnern.
  verify:
    runs-on: [self-hosted, farmhaus, linux]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # E2E im echten Browser. Lint, Unit-Tests und Build haben an einem Tag
      # sechs Fehler durchgelassen, die alle erst hier aufgefallen sind.
      - name: Browser für E2E installieren
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      # Der Bericht geht in den Artefakt-Speicher der Farm (Seite "Builds"),
      # nicht zu GitHub. Nur ausserhalb der Farm Rückfall auf GitHub, 3 Tage.
      - name: Bericht bei Fehlschlag in die Farm hochladen
        id: farm
        if: failure()
        shell: bash
        run: |
          # Lint oder Unit-Tests rot: E2E lief nicht, es gibt keinen Bericht.
          if [ ! -d playwright-report ]; then echo "farm=leer" >> "$GITHUB_OUTPUT"; exit 0; fi
          tar --zstd -cf playwright-bericht.tar.zst playwright-report/
          # Scheitert der Upload (Dienst noch nicht in Betrieb), greift der Rückfall.
          if command -v fh-artifact >/dev/null && [ -n "${FH_ARTIFACTS:-}" ] \
             && fh-artifact upload playwright-bericht.tar.zst --name playwright-bericht; then
            echo "farm=true" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Artefakt-Dienst am Standort – Rückfall auf actions/upload-artifact"
            echo "farm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rückfall auf GitHub-Artefakte
        if: failure() && steps.farm.outputs.farm == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: playwright-bericht.tar.zst
          retention-days: 3

  build:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Pusht nur zu Docker Hub; das Ausrollen macht der deploy-Job im Heimnetz.
    runs-on: [self-hosted, farmhaus, linux]
    # Nie zwei Bau-Läufe gleichzeitig: sonst kann ein älterer Lauf sein
    # :latest NACH einem neueren pushen, und Komodo zöge das alte Image in
    # die Küche. Wartende Läufe reihen sich ein; GitHub behält davon nur den
    # neuesten, und der ist der richtige.
    concurrency:
      group: bauen-und-ausrollen
      cancel-in-progress: false
    env:
      IMAGE_NAME: splord/labelkitchen

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Docker Tag (commit hash + date)
        id: version
        run: |
          DATE=$(date +"%Y%m%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Erst lokal bauen und starten, dann pushen: der deploy-Job rollt jedes
      # gepushte :latest sofort in die Küche. Ein Image, das nicht startet,
      # darf dort nie ankommen.
      - name: Image bauen (lokal)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}

      - name: Rauchtest – startet das Image mit und ohne Bugsink?
        env:
          IMG: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          # Syntaktisch gültig, Host existiert nicht: der Tunnel muss dann 502
          # liefern, nginx aber trotzdem laufen.
          SCHEIN_DSN: https://00000000000000000000000000000000@bugsink.invalid/9
        run: |
          set -eu
          docker run -d --name ohne   -p 8081:80 "$IMG"
          docker run -d --name mit    -p 8082:80 -e SENTRY_DSN="$SCHEIN_DSN" "$IMG"
          docker run -d --name kaputt -p 8083:80 -e SENTRY_DSN=nicht-gueltig "$IMG"
          for p in 8081 8082 8083; do
            for i in $(seq 1 20); do curl -fsS "localhost:$p/" >/dev/null 2>&1 && break; sleep 0.5; done
            curl -fsS "localhost:$p/" >/dev/null
          done
          status() { curl -s -o /dev/null -w '%{http_code}' -X POST "localhost:$1/api/9/envelope/" -d x; }

          # Ohne DSN: kein Tracking, kein Tunnel
          curl -fsS localhost:8081/api/client-config | grep -q '"enabled":false'
          test "$(status 8081)" = 404
          # Mit DSN: freigegeben, Tunnel vorhanden (Ziel unerreichbar -> 502)
          curl -fsS localhost:8082/api/client-config | grep -q '"enabled":true'
          curl -fsS localhost:8082/api/client-config | grep -q '"projekt":"9"'
          test "$(status 8082)" = 502
          # Kaputter DSN verhindert den Start nicht, schaltet nur ab
          curl -fsS localhost:8083/api/client-config | grep -q '"enabled":false'
          # Der Schlüssel taucht weder beim Browser noch in den Logs auf.
          # Bewusst if/exit statt "! befehl": ein mit ! verneinter Befehl
          # bricht unter set -e nicht ab – die Prüfung wäre zahnlos.
          if curl -fsS localhost:8082/api/client-config | grep -q 00000000000000000000000000000000; then
            echo "Schlüssel in /api/client-config sichtbar"; exit 1
          fi
          docker logs mit 2>&1 | grep -q 'Fehlertracking aktiv'
          if docker logs mit 2>&1 | grep -q 00000000000000000000000000000000; then
            echo "Schlüssel in den Container-Logs"; exit 1
          fi
          # Der Tunnel leitet richtig weiter: die tatsächlich geladene
          # Konfiguration muss die tragenden Direktiven enthalten. Ob TLS und
          # Bugsink wirklich mitspielen, zeigt erst der Test gegen das echte
          # Bugsink nach dem Ausrollen – bugsink.invalid ist nie erreichbar.
          KONF=$(docker exec mit nginx -T 2>/dev/null)
          for d in 'sentry_key=00000000000000000000000000000000' 'set $args ""' \
                   'proxy_ssl_verify on' 'proxy_ssl_verify_depth 3' \
                   'limit_req zone=bugsink_gesamt' 'proxy_set_header Cookie ""' \
                   'location = /api/9/envelope/'; do
            printf '%s' "$KONF" | grep -qF "$d" || { echo "fehlt in der Konfiguration: $d"; exit 1; }
          done
          # Die Startseite darf nicht ungefragt aus dem Zwischenspeicher kommen
          curl -sI localhost:8081/ | grep -qi '^cache-control: no-cache' || { echo "Startseite ohne no-cache"; exit 1; }
          # Der Etikettenspeicher läuft unverändert
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8081/daten/etiketten.json)" = 204
          echo "Rauchtest bestanden"

      - name: Rauchtest – Logs bei Fehlschlag
        if: failure()
        run: for c in ohne mit kaputt; do echo "== $c"; docker logs "$c" 2>&1 | tail -20; done

      - name: Image pushen
        run: docker push --all-tags ${{ env.IMAGE_NAME }}

  # Seit 13.10.2026 rollt Komodo aus (Portainer ist abgeschaltet). Der Stack
  # labelkitchenprinter auf docker-prod zieht :latest; "Webhook Force Deploy"
  # erzeugt den Container auch ohne Änderung an der Compose-Datei neu.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Komodo und die Küche sind nur im Heimnetz erreichbar.
    runs-on: [self-hosted, farmhaus, linux, deploy-home]
    concurrency:
      group: ausrollen
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Komodo-Deploy auslösen
        env:
          URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::KOMODO_WEBHOOK_URL/KOMODO_WEBHOOK_SECRET fehlen – kein Deploy"
            exit 1
          fi
          body='{"ref":"refs/heads/main"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          code=$(curl -sk -o komodo.out -w '%{http_code}' --max-time 120 \
                   -X POST "$URL" -H 'Content-Type: application/json' \
                   -H 'X-GitHub-Event: push' -H "X-Hub-Signature-256: sha256=$sig" -d "$body")
          echo "Komodo-Webhook: HTTP $code"
          head -c 500 komodo.out || true
          case "$code" in
            2??) echo "Deploy ausgelöst." ;;
            *) echo "::error::Komodo-Webhook fehlgeschlagen (HTTP $code)"; exit 1 ;;
          esac

      # Komodo arbeitet asynchron: bis zum Neuerzeugen antwortet auch der alte
      # Container mit 200. Deshalb auf die Version im JS-Bündel warten.
      - name: Deploy verifizieren
        run: |
          want="labelkitchen@$(node -p 'require("./package.json").version')"
          for i in $(seq 1 30); do
            js=$(curl -fsS --max-time 10 http://192.168.10.57:7077/ | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            got=$( [ -n "$js" ] && curl -fsS --max-time 10 "http://192.168.10.57:7077/$js" | grep -o 'labelkitchen@[0-9.]*' | head -1 || true)
            echo "Versuch $i: live=${got:-?} erwartet=$want"
            [ "$got" = "$want" ] && { echo "$want ist live."; exit 0; }
            sleep 10
          done
          echo "::error::Nach 300 s läuft nicht $want (zuletzt: ${got:-keine Antwort})"
          exit 1
