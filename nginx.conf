# Fehlermeldungen an Bugsink drosseln (je Gerät). Die Zone muss im
# http-Kontext stehen, genutzt wird sie in /etc/nginx/bugsink.conf.
limit_req_zone $binary_remote_addr zone=bugsink:1m rate=30r/m;
# Gesamtdeckel über alle Geräte ($server_name ist konstant "_")
limit_req_zone $server_name zone=bugsink_gesamt:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Einseiten-Anwendung: unbekannte Pfade auf index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Die Startseite nie ungefragt aus dem Zwischenspeicher: ohne diese
        # Zeile durfte der Browser sie nach eigenem Ermessen behalten. Nach
        # einem Rollout zeigte er dann weiter die alte Version – das neue
        # Katzenzimmer war am 06.10.2026 beim Nutzer deshalb unsichtbar.
        # no-cache heisst: behalten ja, aber vor jeder Nutzung nachfragen.
        # Die Dateien unter /assets/ tragen einen Hash im Namen und dürfen
        # weiter ein Jahr liegen (siehe unten).
        add_header Cache-Control "no-cache" always;
    }

    # ── Gemeinsamer Etiketten-Speicher ───────────────────────────────────────
    #
    # Die Etiketten lagen bisher im localStorage genau eines Browsers. Hier
    # liegen sie auf einem Docker-Volume, damit alle Geräte dieselbe Liste
    # sehen. Es ist bewusst kein Dienst und keine Datenbank: der Bestand ist
    # ein einziges JSON von rund zwei Kilobyte, dafür genügt PUT und GET.
    #
    # Anmeldung ist nur zur Hälfte vorbereitet. Die beiden auth_basic-Zeilen
    # unten schalten sie in nginx ein (Datei anlegen mit
    #   htpasswd -bc /etc/nginx/etiketten.htpasswd kueche GEHEIM),
    # aber src/labels/fernspeicher.js schickt keine Zugangsdaten mit. Ob der
    # Browser dann von selbst nachfragt, ist bei fetch nicht verlässlich –
    # vor dem Einschalten auf dem Tablet ausprobieren.
    location /daten/ {
        alias /var/lib/labelkitchen/;

        # auth_basic           "Etiketten";
        # auth_basic_user_file /etc/nginx/etiketten.htpasswd;

        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;

        # Zwischendatei muss auf demselben Dateisystem liegen wie das Ziel,
        # sonst scheitert das abschliessende Umbenennen über Gerätegrenzen.
        client_body_temp_path /var/lib/labelkitchen/.tmp;
        client_max_body_size 1m;

        autoindex off;
        add_header Cache-Control "no-store" always;

        # Fehlt die Datei noch, ist das kein Fehler, sondern der Erstzustand.
        error_page 404 = @leer;
    }

    location @leer {
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # ── Fehlertracking (Bugsink) ─────────────────────────────────────────────
    # /api/client-config und der Tunnel /api/<projekt>/envelope/. Die Datei
    # entsteht beim Containerstart aus SENTRY_DSN (docker/40-bugsink.sh). Im
    # Image liegt eine Variante ohne Tracking, damit nginx auch ohne das
    # Startskript nie an einem fehlenden include scheitert.
    include /etc/nginx/bugsink.conf;

    # Gebaute Dateien tragen einen Hash im Namen und dürfen lange liegen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
